<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fechador Digital de Fe Cierta - Estilo Gubernamental</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #0284c7;
      --neon-cyan: #38bdf8;
      --text-color: #f8fafc;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 1.3rem;
      color: var(--neon-cyan);
    }

    /* Reloj en vivo de referencia superior */
    .timeline-bar {
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      font-family: monospace;
      margin-bottom: 16px;
    }

    .clock-live {
      font-size: 1.1rem;
      font-weight: bold;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      word-break: break-all;
    }

    .upload-zone {
      border: 2px dashed #0284c7;
      border-radius: 8px;
      padding: 24px 12px;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
      background: #111827;
    }

    .upload-zone p {
      margin: 0;
      font-weight: 600;
      color: #38bdf8;
    }

    input[type="file"] {
      display: none;
    }

    #hiddenCanvas {
      display: none;
    }

    .result-section {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .result-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid #334155;
      background: #000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .download-link {
      display: block;
      width: 100%;
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 14px 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .download-link:active {
      background: #0369a1;
    }

    .hint-text {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Fechador Digital de Fe Cierta</h1>

  <!-- Reloj continuo de referencia -->
  <div class="timeline-bar">
    <div style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 4px;">HORA OFICIAL PROVINCIA DE BS. AS. (ART / UTC-3)</div>
    <div class="clock-live" id="liveClock">00/00/0000 00:00:00.000 ART</div>
  </div>

  <!-- Zona de carga -->
  <div class="upload-zone" onclick="document.getElementById('imgInput').click()">
    <p>📷 TOCAR AQUÍ PARA SUBIR O TOMAR FOTO</p>
    <input type="file" id="imgInput" accept="image/*" onchange="handleFileSelect(this.files[0])">
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <!-- Resultado con estampa totalmente integrada dentro de la foto -->
  <div class="result-section" id="resultSection">
    <p style="text-align: left; margin-bottom: 8px; font-weight: bold; color: #cbd5e1;">Documento Digital Fechado:</p>
    <img id="finalImage" class="result-img" alt="Imagen estampada">
    
    <a id="downloadBtn" class="download-link" href="#" download="fechado_oficial.png">📥 DESCARGAR IMAGEN ESTAMPADA</a>
    <p class="hint-text">(También puedes mantener presionada la imagen para guardarla en el celular)</p>
  </div>
</div>

<script>
  // Obtener fecha y hora oficial de Argentina con milisegundos
  function getArgentinaFormattedTime(dateObj = new Date()) {
    const ms = String(dateObj.getMilliseconds()).padStart(3, '0');
    
    const options = {
      timeZone: 'America/Argentina/Buenos_Aires',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    };

    const formatter = new Intl.DateTimeFormat('es-AR', options);
    const parts = Object.fromEntries(formatter.formatToParts(dateObj).map(p => [p.type, p.value]));

    const dateStr = `${parts.day}/${parts.month}/${parts.year}`;
    const timeStr = `${parts.hour}:${parts.minute}:${parts.second}.${ms}`;

    return {
      full: `${dateStr} ${timeStr} ART (UTC-3)`,
      dateOnly: dateStr,
      timeOnlyMs: timeStr,
      stampTime: `${parts.hour}:${parts.minute}:${parts.second}.${ms}`
    };
  }

  // Reloj continuo de la cabecera
  function updateLiveClock() {
    const timeData = getArgentinaFormattedTime();
    document.getElementById('liveClock').textContent = timeData.full;
    requestAnimationFrame(updateLiveClock);
  }
  requestAnimationFrame(updateLiveClock);

  function handleFileSelect(file) {
    if (!file) return;

    const timeData = getArgentinaFormattedTime(new Date());
    
    const sizeInKB = (file.size / 1024).toFixed(2);
    const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
    const sizeStr = file.size > 1048576 ? `${sizeInMB} MB (${file.size} bytes)` : `${sizeInKB} KB (${file.size} bytes)`;

    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const geoStr = `Lat: ${pos.coords.latitude.toFixed(6)}, Lon: ${pos.coords.longitude.toFixed(6)} (±${pos.coords.accuracy.toFixed(1)}m)`;
          generateGovernmentStamp(file, timeData, sizeStr, geoStr);
        },
        () => {
          generateGovernmentStamp(file, timeData, sizeStr, "GEO: No permitida");
        },
        { enableHighAccuracy: true, timeout: 5000 }
      );
    } else {
      generateGovernmentStamp(file, timeData, sizeStr, "GEO: No soportada");
    }
  }

  function generateGovernmentStamp(file, timeData, sizeStr, geoStr) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.getElementById('hiddenCanvas');
        const ctx = canvas.getContext('2d');

        const imgWidth = img.width;
        const imgHeight = img.height;

        // Todo se dibuja SOBRE la imagen original
        canvas.width = imgWidth;
        canvas.height = imgHeight;

        // 1. DIBUJAR LA FOTO ORIGINAL COMPLETA
        ctx.drawImage(img, 0, 0, imgWidth, imgHeight);

        // 2. FAJA DE ACTA GUBERNAMENTAL (Semitransparente dentro de la propia foto)
        const bannerHeight = Math.max(120, Math.round(imgHeight * 0.22));
        const bannerY = imgHeight - bannerHeight;

        // Fondo oscuro tipo cinta de evidencia
        ctx.fillStyle = 'rgba(10, 17, 40, 0.88)';
        ctx.fillRect(0, bannerY, imgWidth, bannerHeight);

        // Línea de cierre superior verde/celeste neón con resplandor
        ctx.shadowColor = '#00d8ff';
        ctx.shadowBlur = 8;
        ctx.strokeStyle = '#00d8ff';
        ctx.lineWidth = Math.max(3, Math.round(imgWidth * 0.004));
        ctx.beginPath();
        ctx.moveTo(0, bannerY);
        ctx.lineTo(imgWidth, bannerY);
        ctx.stroke();
        ctx.shadowBlur = 0; // Reset sombra

        // Estilos de texto adaptativos
        const fontSizeTitle = Math.max(14, Math.round(imgWidth * 0.026));
        const fontSizeData = Math.max(11, Math.round(imgWidth * 0.020));
        const marginX = Math.round(imgWidth * 0.03);

        ctx.fillStyle = '#00d8ff';
        ctx.font = `bold ${fontSizeTitle}px monospace`;
        ctx.fillText('ACTA OFICIAL DE ESTAMPA TEMPORAL Y FE CIERTA', marginX, bannerY + (bannerHeight * 0.22));

        ctx.fillStyle = '#f8fafc';
        ctx.font = `${fontSizeData}px monospace`;
        ctx.fillText(`HORA/FECHA OFICIAL: ${timeData.full}`, marginX, bannerY + (bannerHeight * 0.45));
        ctx.fillText(`ARCHIVO ORIGINAL  : ${file.name.substring(0, 30)} (${sizeStr})`, marginX, bannerY + (bannerHeight * 0.67));
        ctx.fillText(`GEOLOCALIZACIÓN   : ${geoStr}`, marginX, bannerY + (bannerHeight * 0.88));

        // 3. SELLO RECTANGULAR ESTILO VINTAGE GUBERNAMENTAL (Pisa la esquina superior derecha)
        const stampW = Math.max(210, Math.round(imgWidth * 0.36));
        const stampH = Math.max(115, Math.round(stampW * 0.55));
        const stampX = imgWidth - stampW - Math.round(imgWidth * 0.03);
        const stampY = Math.round(imgHeight * 0.03);

        ctx.save();
        ctx.translate(stampX + (stampW / 2), stampY + (stampH / 2));
        ctx.rotate(-5 * Math.PI / 180); // Leve inclinación de sello oficial

        // Fondo azul marino semitransparente
        ctx.fillStyle = 'rgba(10, 25, 47, 0.92)';
        ctx.fillRect(-stampW/2, -stampH/2, stampW, stampH);

        // Borde doble gubernamental en azul
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = Math.max(3, Math.round(stampH * 0.04));
        ctx.strokeRect(-stampW/2, -stampH/2, stampW, stampH);

        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.strokeRect((-stampW/2) + 4, (-stampH/2) + 4, stampW - 8, stampH - 8);

        const fontHeader = Math.max(10, Math.round(stampH * 0.12));
        const fontNeonTime = Math.max(11, Math.round(stampH * 0.16));
        const fontSub = Math.max(8, Math.round(stampH * 0.09));

        // Título del sello
        ctx.fillStyle = '#60a5fa';
        ctx.textAlign = 'center';
        ctx.font = `bold ${fontHeader}px sans-serif`;
        ctx.fillText('FECHADO Y HORA OFICIAL', 0, -stampH * 0.28);

        ctx.font = `${fontSub}px monospace`;
        ctx.fillText(`FECHA: ${timeData.dateOnly}`, 0, -stampH * 0.10);

        // MILISEGUNDOS Y HORA EN CELESTE NEÓN BRILLANTE
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 12;
        ctx.fillStyle = '#00f0ff';
        ctx.font = `bold ${fontNeonTime}px monospace`;
        ctx.fillText(timeData.stampTime, 0, stampH * 0.18);
        ctx.shadowBlur = 0; // Reset sombra

        // Pie del sello gubernamental
        ctx.fillStyle = '#93c5fd';
        ctx.font = `bold ${fontSub}px sans-serif`;
        ctx.fillText('PROVINCIA DE BS. AS. • ART', 0, stampH * 0.38);

        ctx.restore();

        // 4. GENERAR IMAGEN FINAL
        const dataUrl = canvas.toDataURL('image/png');
        
        const finalImg = document.getElementById('finalImage');
        finalImg.src = dataUrl;

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = dataUrl;
        downloadBtn.download = `Fechado_Oficial_Gubernamental_${Date.now()}.png`;

        document.getElementById('resultSection').style.display = 'block';
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }
</script>

</body>
</html>
